name: fp-conformance

# Functional-programming conformance ratchet plus source-only configuration
# security checks. Deliberately cheap: stdlib Python, no dependency install,
# no network.

on:
  pull_request:
    paths:
      - '**.rs'
      - '**.ts'
      - '**.tsx'
      - '**.dart'
      - '.cli-flags.toml'
      - 'tools/fp-conformance/**'
      - '.github/workflows/fp-conformance.yml'
  push:
    branches: [main, dev]
    paths:
      - '**.rs'
      - '**.ts'
      - '**.tsx'
      - '**.dart'
      - '.cli-flags.toml'
      - 'tools/fp-conformance/**'
      - '.github/workflows/fp-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fp-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: functional programming conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Enforce environment-only database credential boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          key = "FLAGS_2_ENV_DATABASE_URL"
          with Path(".cli-flags.toml").open("rb") as stream:
              config = tomllib.load(stream)

          ignored = set(config.get("env", {}).get("ignore", []))
          if key not in ignored:
              raise SystemExit(f"{key} must remain in [env].ignore")

          for name, spec in config.get("flags", {}).items():
              if spec.get("env") == key:
                  raise SystemExit(f"credential {key} must not be owned by [flags.{name}]")

          generated = Path("src/env/generated.rs").read_text()
          if key in generated:
              raise SystemExit(f"generated projection must not expose env-only credential {key}")

          manual_env = Path("src/env/env.rs").read_text()
          canonical = Path("src/flags.rs").read_text()
          if key not in manual_env or key not in canonical:
              raise SystemExit(f"{key} must remain explicit in both audited process-env paths")
          PY

      - name: Scan
        run: |
          python3 tools/fp-conformance/fp_conformance.py . \
            --json fp-findings.json \
            --budget tools/fp-conformance/budget.json \
            --limit 60

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fp-findings
          path: fp-findings.json
          if-no-files-found: ignore
          retention-days: 14
